<style>
        /* Ambient map styling */
        .map-bg {
            background-color: #e0e6ed;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 60%),
                linear-gradient(0deg, rgba(26, 79, 149, 0.05) 0%, transparent 100%);
        }
        
        /* Map lines simulation */
        .route-line {
            stroke: #1A4F95;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0px 2px 4px rgba(26, 79, 149, 0.3));
        }

        .route-dash {
            stroke: #FF7A00;
            stroke-width: 4;
            stroke-dasharray: 8 8;
            stroke-linecap: round;
            fill: none;
            animation: dash 2s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -16;
            }
        }

        /* Subtle pulse for live tracking */
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px -4px rgba(26, 79, 149, 0.12);
        }
    </style>
</head>
<body class="bg-surface-gray text-on-surface font-body-md min-h-screen flex flex-col antialiased overflow-hidden">
<!-- TopAppBar JSON Render -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-40 md:hidden flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A small, professional headshot photo of a parent, smiling warmly. Soft, even lighting suitable for a profile avatar in a modern utility application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEcTcPvh0NlNJFo3akMarDZM0YGyAa6Mi5-w4JSOTZ6syoz50LEy1MJy-PrKbrolc3Vf5S_ozRvLQQYm178r_I8thvenujucXEp__mIQpTqTUSOgcHf3vNNcsmrTXkkAysQIkkQDh9ZCOKuTRnxXa9Rml9ZBK1f4i58i3MsDDEJyQucTc4f7EV3yLdRafs8gL__yxuSJmrVyWZB2oVgQiDZPxayYmN4c0QjQB94QPedGeqQ4biuPhYFw"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-safety-blue">SchoolBus Safe</h1>
</div>
<button class="text-primary hover:bg-surface-container transition-colors active:scale-95 duration-100 p-2 rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Map Canvas -->
<main class="flex-grow relative map-bg w-full h-full flex flex-col">
<!-- SVG Map Background Representation -->
<div class="absolute inset-0 z-0 overflow-hidden" data-location="Suburban Neighborhood Map" style="">
<!-- Simulated Map Image Layer -->
<div class="absolute inset-0 bg-cover bg-center opacity-40" data-alt="A clean, minimalist digital map background showing a suburban neighborhood layout with winding roads and cul-de-sacs. The map uses a light, modern color palette with soft greys and subtle greens to denote parks. The aesthetic is similar to high-end ride-sharing or delivery tracking applications, focusing on clarity and lack of clutter." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDCgxuKyCfQwrPQXpsDUkKfzdHVm6YnkfNxHxzvqcrFnQzrd6Zhqp0Srsoheb3JKRtwEcpEtSeNuRPW1SeLI2Iq0Y5O9zcZG0_6-tjCsUO4qILryT8HSeTI4acdnAHRHlrZtch0xixJdjeD9j_huBOm114HDBH1DBbKFS2Xl9DrfRtfMXsX02jS6gIZ7HXJ-ofMHXHPyavI8rVRZc2edVph1sOtRdGaB30oVpSOp5FZWtlYDWDFDvP-uA')"></div>
<!-- Simulated Route Paths overlaying the map -->
<svg class="absolute inset-0 w-full h-full" preserveaspectratio="none" viewbox="0 0 1000 1000">
<!-- Completed Route -->
<path class="route-line" d="M 200,800 Q 300,750 400,600 T 600,400"></path>
<!-- Remaining Route -->
<path class="route-dash" d="M 600,400 Q 700,300 850,250"></path>
<!-- Bus Stop Pins -->
<!-- Stop 1 (Completed) -->
<circle cx="200" cy="800" fill="#c3c6d2" r="8" stroke="#ffffff" stroke-width="2"></circle>
<!-- Stop 2 (Completed) -->
<circle cx="400" cy="600" fill="#c3c6d2" r="8" stroke="#ffffff" stroke-width="2"></circle>
<!-- Stop 3 (Next Stop) -->
<circle cx="850" cy="250" fill="#FF7A00" r="12" stroke="#ffffff" stroke-width="3"></circle>

<!-- Live Bus Pin (Animated) -->
<div class="absolute top-[40%] left-[60%] -translate-x-1/2 -translate-y-1/2 z-10 flex flex-col items-center">
<div class="bg-safety-blue text-white px-3 py-1 rounded-full font-label-md text-label-md mb-2 shadow-lg whitespace-nowrap flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-success-green"></span>
                    On Route
                </div>
<div class="relative">
<div class="absolute inset-0 rounded-full bg-safety-blue pulse-ring"></div>
<div class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center relative z-10 border-2 border-safety-blue">
<span class="material-symbols-outlined text-safety-blue text-[24px]" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
</div>
</div>
</div>
</div>
<!-- Top Information Overlay (ETA) -->
<div class="relative z-20 w-full px-margin-mobile pt-4 hidden md:block">

</div>
</div>
<!-- Bottom Information Sheet / Floating Card -->
<div class="relative z-20 mt-auto w-full pb-[100px] md:pb-8 pt-4 px-margin-mobile flex justify-center">
<div class="glass-panel rounded-xl w-full max-w-md p-card-padding flex flex-col gap-stack-gap">
<!-- Mobile ETA (visible only on small screens) -->
<div class="md:hidden flex justify-between items-end border-b border-outline-variant pb-3">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase">Est. Arrival</p>
<p class="font-headline-md text-headline-md text-alert-orange">8:14 AM</p>
</div>
<div class="text-right">
<p class="font-label-md text-label-md text-on-surface-variant">Status</p>
<div class="flex items-center gap-1 text-success-green">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-body-md text-body-md font-medium">On Schedule</span>
</div>
</div>
</div>
<!-- Next Stop Info -->
<div class="flex items-start gap-3 pt-1">
<div class="w-10 h-10 rounded-full bg-secondary-container/10 flex items-center justify-center flex-shrink-0 mt-1">

</div>
<div>

</div>

</div>
<div>
<p class="font-body-md text-body-md font-medium text-on-surface">Sarah Johnson</p>
<p class="font-label-md text-label-md text-on-surface-variant">4th Grade</p>
</div>
</div>
<button class="w-10 h-10 rounded-full bg-white shadow-sm border border-outline-variant flex items-center justify-center text-safety-blue hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">call</span>
</button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar JSON Render -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant md:hidden flex justify-around items-center h-20 px-2 pb-safe shadow-lg">

</a>

<span class="font-label-md text-label-md mt-1">Students</span>
</a>

<span class="material-symbols-outlined">directions_bus</span>
