name: schoolbus_safe
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  firebase_database: ^12.0.4
  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  # Persists login session + active tab across browser reloads (web) and
  # app restarts (mobile/desktop) via SessionService.
  shared_preferences: ^2.5.0
  firebase_auth: ^6.6.1
  url_launcher: ^6.3.1
  # Bulk Admin roster import (Fleet Management -> Import Roster): parses
  # the school office's .xlsx sheet, and lets the Admin pick that file
  # from disk on any platform (web/desktop/mobile).
  excel: ^4.0.3
  file_picker: ^12.2.0
  geolocator: ^13.0.0
  permission_handler: ^11.0.0

  # Real geographic map for live bus tracking (SRS §10.6 requires an
  # actual map, not an illustrated placeholder).
  # flutter_map uses OpenStreetMap tiles by default — no API key needed,
  # works on all platforms. See lib/widgets/live_map_canvas.dart for the
  # tile provider configuration and the production-deployment note.
  flutter_map: ^8.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/developers/